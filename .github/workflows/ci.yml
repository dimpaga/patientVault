name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Test, security-scan and image-build stages are added once the test suite exists (see docs/DECISIONS.md D-003).
      - name: Build
        run: ./mvnw -B -ntp -DskipTests verify
