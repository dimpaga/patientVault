[couchdb]
single_node = true
default_security = admin_only
; 150 MiB: app max file size (100 MB) plus encryption and HTTP overhead
max_attachment_size = 157286400

[chttpd]
; reachable only on the private network / compose network
bind_address = 0.0.0.0
require_valid_user = true
max_http_request_size = 157286400
