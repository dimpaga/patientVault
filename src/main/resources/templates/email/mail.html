<!DOCTYPE html>
<!-- Generic e-mail layout: title, intro, a label/value table and one button. Inline styles are fine in e-mail. -->
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:24px;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">
            <table role="presentation" width="520" cellpadding="0" cellspacing="0"
                   style="max-width:520px;background:#ffffff;border-radius:12px;padding:28px;">
                <tr>
                    <td>
                        <h1 style="margin:0 0 12px;font-size:20px;color:#0b6b6b;" th:text="${title}">Title</h1>
                        <p style="margin:0 0 16px;line-height:1.5;" th:text="${intro}">Intro</p>
                        <table role="presentation" cellpadding="6" cellspacing="0" style="margin:0 0 20px;width:100%;"
                               th:if="${!rows.isEmpty()}">
                            <tr th:each="row : ${rows}">
                                <td style="color:#52606d;white-space:nowrap;vertical-align:top;" th:text="${row.label}">Label</td>
                                <td style="font-weight:bold;" th:text="${row.value}">Value</td>
                            </tr>
                        </table>
                        <p style="margin:0 0 20px;">
                            <a th:href="${url}" th:text="${buttonLabel}"
                               style="display:inline-block;background:#0b6b6b;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;">Open</a>
                        </p>
                        <p style="margin:0;font-size:12px;color:#7b8794;line-height:1.4;" th:text="${footer}">Footer</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
