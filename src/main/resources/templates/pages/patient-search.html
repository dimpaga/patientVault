<!DOCTYPE html>
<html th:replace="~{layout/base :: page(~{::title}, ~{::#pv-page}, ${nav})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{search.title} + ' · ' + #{app.name}">Patients · PatientVault</title>
</head>
<body>
<div id="pv-page">
    <h1 class="h3 mb-4" th:text="#{search.heading}">Patients</h1>

    <div class="d-flex align-items-center gap-2 mb-4">
        <a class="btn btn-cta btn-lg" th:href="@{/patients/new}">
            <i class="bi bi-person-plus" aria-hidden="true"></i><span th:text="#{nav.newPatient}">New patient</span>
        </a>
        <a class="btn btn-search" th:href="@{/patients}" data-pv-search-toggle hx-boost="false" aria-expanded="false"
           aria-controls="pv-search-panel" th:aria-label="#{search.label}" th:title="#{search.label}">
            <i class="bi bi-search" aria-hidden="true"></i>
        </a>
    </div>

    <div th:replace="~{patients/results :: results}"></div>
</div>
</body>
</html>
