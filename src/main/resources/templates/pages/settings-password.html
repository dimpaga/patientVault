<!DOCTYPE html>
<html th:replace="~{layout/base :: page(~{::title}, ~{::main}, 'settings')}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{settings.password.change} + ' · ' + #{app.name}">Change password · PatientVault</title>
</head>
<body>
<main>
    <h1 class="h3 mb-3" th:text="#{settings.password.change}">Change password</h1>

    <div class="alert alert-danger" role="alert" th:if="${problems != null}">
        <ul class="mb-0">
            <li th:each="problem : ${problems}" th:text="#{${problem}(${minLength})}">Problem</li>
        </ul>
    </div>

    <div class="card pv-card pv-form-card">
        <div class="card-body">
            <form method="post" th:action="@{/settings/password}" hx-boost="false">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label" th:text="#{settings.password.current}">Current password</label>
                    <input type="password" class="form-control" id="currentPassword" name="currentPassword" required
                           autocomplete="current-password" autofocus data-pv-focus>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label" th:text="#{settings.password.new}">New password</label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" required
                           autocomplete="new-password" th:attr="minlength=${minLength}" aria-describedby="new-help">
                    <div id="new-help" class="form-text" th:text="#{settings.password.rules(${minLength})}">At least 12 characters.</div>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label" th:text="#{settings.password.confirm}">Repeat new password</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required
                           autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary" th:text="#{settings.password.submit}">Change password</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
