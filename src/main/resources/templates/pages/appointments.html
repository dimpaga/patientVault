<!DOCTYPE html>
<html th:replace="~{layout/base :: page(~{::title}, ~{::#pv-page}, 'appointments')}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{appointments.title} + ' · ' + #{app.name}">Appointments · PatientVault</title>
</head>
<body>
<div id="pv-page">
    <h1 class="h3 mb-4 mb-md-5" th:text="#{appointments.heading}">Appointments</h1>

    <!-- time window: glass segmented control; agenda.js slides the highlight and frosts the list while it changes -->
    <div class="pv-range mb-3 mb-md-4" data-pv-range>
        <span class="pv-range-thumb" aria-hidden="true"></span>
        <ul class="nav nav-pills pv-range-pills" id="pv-range-list" th:aria-label="#{appointments.range}">
            <li class="nav-item" th:each="r : ${ {'today','week','month'} }">
                <a class="nav-link" th:classappend="${range == r} ? 'active'" th:href="@{/appointments(range=${r})}"
                   th:hx-get="@{/appointments(range=${r})}" hx-target="#pv-agenda" hx-swap="outerHTML"
                   hx-push-url="true" hx-boost="false" hx-sync="#pv-range-list:replace"
                   th:attr="aria-current=${range == r} ? 'page'" th:data-pv-range-value="${r}"
                   th:text="#{'appointments.range.' + ${r}}">Today</a>
            </li>
        </ul>
    </div>

    <th:block th:replace="~{appointments/agenda :: agenda}"></th:block>

    <!-- Edit Modal for Agenda -->
    <div class="modal fade" id="pv-edit-modal" tabindex="-1" aria-labelledby="pv-edit-modal-label" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="pv-edit-modal-label" th:text="#{appointment.reschedule}">Edit Appointment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="pv-edit-form-container">
                    <!-- Form will be loaded here via HTMX -->
                </div>
            </div>
        </div>
    </div>

    <script>
    function openEditModal(button) {
        const appointmentId = button.getAttribute('data-appointment-id');
        const patientId = button.getAttribute('data-patient-id');
        const url = '/patients/' + patientId + '/appointments?edit=' + appointmentId + '&modal=true';

        htmx.ajax('GET', url, {
            target: '#pv-edit-form-container',
            swap: 'innerHTML',
            onComplete: function() {
                const modal = new bootstrap.Modal(document.getElementById('pv-edit-modal'));
                modal.show();
            }
        });
    }
    </script>
</body>
</html>
