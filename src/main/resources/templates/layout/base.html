<!DOCTYPE html>
<!--
  Authenticated application shell. Pages use:
  <html th:replace="~{layout/base :: page(~{::title}, ~{::#pv-page}, 'navKey')}"> ... <title>..</title> <div id="pv-page">..</div>
-->
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:fragment="page(title, content, nav)">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body class="pv-body">
<a class="visually-hidden-focusable pv-skip" href="#pv-main" th:text="#{nav.skip}">Skip to main content</a>

<div id="pv-app" hx-boost="true" th:attr='hx-headers=|{"${_csrf.headerName}":"${_csrf.token}"}|'>
    <header class="pv-topbar sticky-top">
        <div class="pv-topbar-inner">
            <button type="button" class="pv-ghost pv-icon-btn d-none d-lg-inline-flex"
                    data-pv-sidebar-toggle th:aria-label="#{topbar.sidebar}" th:title="#{topbar.sidebar}">
                <i class="bi bi-layout-sidebar" aria-hidden="true"></i>
            </button>
            <a class="pv-brand me-auto" th:href="@{/}" th:aria-label="#{topbar.home}">
                <i class="bi bi-shield-plus pv-accent" aria-hidden="true"></i>
                <span th:text="#{app.name}">PatientVault</span>
            </a>
            <a class="pv-ghost pv-icon-btn" th:href="@{/patients}" data-pv-search-toggle hx-boost="false" aria-expanded="false"
               aria-controls="pv-search-panel" th:aria-label="#{search.label}" th:title="#{search.label}">
                <i class="bi bi-search" aria-hidden="true"></i>
            </a>
            <div th:replace="~{fragments/shell :: preferences}"></div>
            <div class="dropdown" th:if="${currentUsername != null}">
                <button class="pv-ghost dropdown-toggle" type="button"
                        data-bs-toggle="dropdown" aria-expanded="false" th:aria-label="#{topbar.user}">
                    <i class="bi bi-person-circle" aria-hidden="true"></i>
                    <span class="d-none d-sm-inline" th:text="${currentUsername}">doctor</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <form th:action="@{/logout}" method="post" hx-boost="false">
                            <button type="submit" class="dropdown-item">
                                <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>
                                <span th:text="#{nav.logout}">Sign out</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <!-- Search, opened from the magnifier in the top bar on every page. Submitting shows the results on /patients. -->
    <div id="pv-search-panel" class="pv-search-panel" hidden data-pv-search-panel>
        <div class="pv-search-bar">
            <form role="search" method="get" th:action="@{/patients}" class="pv-search-form">
                <label for="pv-topq" class="visually-hidden" th:text="#{search.label}">Search patients</label>
                <i class="bi bi-search pv-search-icon" aria-hidden="true"></i>
                <input id="pv-topq" name="q" type="search" class="pv-search-input" th:value="${q}"
                       th:placeholder="#{search.placeholder}" autocomplete="off" autocapitalize="off" spellcheck="false"
                       maxlength="100" aria-describedby="pv-search-help" data-pv-search-input>
                <button type="button" class="pv-ghost pv-icon-btn" data-pv-search-close
                        th:aria-label="#{common.close}" th:title="#{common.close}">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
            </form>
            <p id="pv-search-help" class="pv-search-help" th:text="#{search.help}">Search by name, email, phone or AMKA.</p>
        </div>
    </div>

    <div class="pv-frame">
        <nav class="pv-sidebar d-none d-lg-block" th:aria-label="#{nav.main}">
            <div th:replace="~{fragments/shell :: items(${nav})}"></div>
        </nav>

        <main id="pv-main" class="pv-content container-fluid py-4" tabindex="-1">
            <div class="alert alert-success" role="status" th:if="${flashSuccess != null}" th:text="#{${flashSuccess}}">Saved</div>
            <div class="alert alert-warning" role="status" th:each="warning : ${flashWarnings}" th:text="#{${warning}}">Warning</div>
            <div class="alert alert-success" role="status" th:if="${flashMessage != null}" th:text="${flashMessage}">Done</div>
            <div class="alert alert-danger" role="alert" th:if="${flashError != null}" th:text="${flashError}">Error</div>
            <div th:replace="${content}">page content</div>
        </main>
    </div>

    <nav class="pv-bottom-nav d-lg-none border-top bg-body" th:aria-label="#{nav.main}">
        <div th:replace="~{fragments/shell :: items(${nav})}"></div>
    </nav>

    <div class="toast-container pv-toasts position-fixed end-0 p-3" id="pv-toasts"
         th:attr="data-pv-error=#{toast.error},data-pv-close=#{common.close}"></div>
    <div id="pv-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
</div>
</body>
</html>
