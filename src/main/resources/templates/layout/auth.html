<!DOCTYPE html>
<!-- Minimal layout for pages shown before login (login, MFA, errors). Not boosted by htmx. -->
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:fragment="page(title, content)">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body class="pv-body pv-auth-body">
<a class="visually-hidden-focusable pv-skip" href="#pv-main" th:text="#{nav.skip}">Skip to main content</a>
<div class="pv-auth-prefs">
    <div th:replace="~{fragments/shell :: preferences}"></div>
</div>
<main id="pv-main" class="pv-auth-main" tabindex="-1">
    <div class="text-center mb-4">
        <i class="bi bi-shield-plus pv-accent pv-auth-logo" aria-hidden="true"></i>
        <div class="h4 mb-0 mt-2" th:text="#{app.name}">PatientVault</div>
        <div class="text-body-secondary small" th:text="#{app.tagline}">Secure patient records</div>
    </div>
    <div th:replace="${content}">content</div>
</main>
</body>
</html>
