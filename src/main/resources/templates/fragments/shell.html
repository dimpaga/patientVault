<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Language switch and theme toggle, shared by the app shell and the public (login/error) pages. -->
<div th:fragment="preferences" class="d-flex align-items-center gap-2">
    <!-- One button: shows the other language and switches to it -->
    <a class="pv-ghost pv-lang-link" hx-boost="false"
       th:with="target=${#locale.language == 'el'} ? 'en' : 'el'"
       th:href="'?lang=' + ${target}" th:lang="${target}" th:hreflang="${target}"
       th:aria-label="#{topbar.language}" th:title="#{topbar.language}"
       th:text="${target == 'el'} ? 'ΕΛ' : 'EN'">ΕΛ</a>
    <button type="button" class="pv-ghost pv-icon-btn" data-pv-theme-toggle
            th:aria-label="#{topbar.theme}" th:title="#{topbar.theme}">
        <i class="bi bi-circle-half" aria-hidden="true"></i>
    </button>
</div>

<!-- Navigation entries; rendered in the sidebar and in the phone bottom bar. -->
<ul th:fragment="items(active)" class="nav pv-nav">
    <li class="nav-item">
        <a class="nav-link" th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'active'"
           th:attr="aria-current=${active == 'dashboard'} ? 'page'">
            <i class="bi bi-speedometer2" aria-hidden="true"></i>
            <span th:text="#{nav.dashboard}">Dashboard</span>
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:href="@{/patients}" th:classappend="${active == 'search' or active == 'patients'} ? 'active'"
           th:attr="aria-current=${active == 'search'} ? 'page'">
            <i class="bi bi-people" aria-hidden="true"></i>
            <span th:text="#{nav.patients}">Patients</span>
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:href="@{/appointments}" th:classappend="${active == 'appointments'} ? 'active'"
           th:attr="aria-current=${active == 'appointments'} ? 'page'">
            <i class="bi bi-calendar-event" aria-hidden="true"></i>
            <span th:text="#{nav.appointments}">Appointments</span>
        </a>
    </li>
    <li class="nav-item pv-nav-end">
        <a class="nav-link" th:href="@{/settings}" th:classappend="${active == 'settings'} ? 'active'"
           th:attr="aria-current=${active == 'settings'} ? 'page'">
            <i class="bi bi-gear" aria-hidden="true"></i>
            <span th:text="#{nav.settings}">Settings</span>
        </a>
    </li>
</ul>

</body>
</html>
