spring:
  thymeleaf:
    cache: false
  datasource:
    password: ${DB_PASSWORD:patientvault}
  mail:
    # Mailpit (docker compose) is a local sink without TLS or login
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false

server:
  servlet:
    session:
      cookie:
        # plain http://localhost during development; production keeps Secure cookies
        secure: false

logging:
  level:
    com.example.patientvault: debug
