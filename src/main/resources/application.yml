spring:
  application:
    name: patientvault
  mvc:
    format:
      date: iso
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:patientvault}${DB_PARAMS:}
    username: ${DB_USER:patientvault}
    password: ${DB_PASSWORD:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  servlet:
    session:
      timeout: ${app.security.session.idle-timeout}
      tracking-modes: cookie
      cookie:
        name: pv_session
        http-only: true
        secure: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: never

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read_only
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,keyRing

logging:
  # Plain-text format (local development): level, request id and user id. Production switches to JSON (application-prod.yml).
  pattern:
    level: "%5p [%X{requestId:-},%X{userId:-}]"
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

app:
  timezone: Europe/Athens
  security:
    session:
      idle-timeout: 15m
      absolute-timeout: 8h
    lockout:
      max-attempts: 5
      duration: 15m
    rate-limit:
      attempts: 10
      window: 1m
  search:
    min-prefix-length: 3
    max-prefix-length: 15
  validation:
    amka:
      strict-date: false
  bootstrap:
    username: ${APP_BOOTSTRAP_USERNAME:}
    password: ${APP_BOOTSTRAP_PASSWORD:}
  crypto:
    master-keys: ${APP_MASTER_KEYS:}
    active-key-id: ${APP_ACTIVE_KEY_ID:}
    blind-index-key-id: ${APP_BLIND_INDEX_KEY_ID:}
