spring:
  application:
    name: patientvault
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:patientvault}${DB_PARAMS:}
    username: ${DB_USER:patientvault}
    password: ${DB_PASSWORD:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: never

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read_only
      probes:
        enabled: true
      show-details: never

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

app:
  timezone: Europe/Athens
  crypto:
    master-keys: ${APP_MASTER_KEYS:}
    active-key-id: ${APP_ACTIVE_KEY_ID:}
    blind-index-key-id: ${APP_BLIND_INDEX_KEY_ID:}
