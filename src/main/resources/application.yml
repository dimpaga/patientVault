spring:
  application:
    name: patientvault
  mvc:
    format:
      date: iso
  servlet:
    multipart:
      max-file-size: ${app.uploads.max-file-size}
      max-request-size: 110MB
      file-size-threshold: 1MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      # the mail leaves the server: encrypt the connection and refuse to fall back to plain text
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:patientvault}${DB_PARAMS:}
    username: ${DB_USER:patientvault}
    password: ${DB_PASSWORD:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  tomcat:
    # read (and discard) the rest of an oversized upload so the browser gets the error message, not a reset
    max-swallow-size: 120MB
  servlet:
    session:
      timeout: ${app.security.session.idle-timeout}
      tracking-modes: cookie
      cookie:
        name: pv_session
        http-only: true
        secure: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: never

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read_only
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,keyRing,couchDb

logging:
  # Plain-text format (local development): level, request id and user id. Production switches to JSON (application-prod.yml).
  pattern:
    level: "%5p [%X{requestId:-},%X{userId:-}]"
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

app:
  timezone: Europe/Athens
  security:
    session:
      idle-timeout: 15m
      absolute-timeout: 8h
    lockout:
      max-attempts: 5
      duration: 15m
    rate-limit:
      attempts: 10
      window: 1m
  search:
    min-prefix-length: 3
    max-prefix-length: 15
    max-candidates: 2000
  mail:
    from: ${MAIL_FROM:PatientVault <no-reply@patientvault.local>}
  doctor:
    # default reminder address until the doctor saves one in Settings
    notification-email: ${APP_DOCTOR_NOTIFICATION_EMAIL:}
  reminders:
    lead-times: P1D,PT1H
    privacy-mode: FULL_NAME
    max-attempts: 5
    retry-base-delay: 1m
    locale: en
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
    daily-digest:
      enabled: true
      at: "07:30"
  uploads:
    max-file-size: 100MB
    max-folder-depth: 12
    thumbnail-size: 320
  couchdb:
    url: ${COUCHDB_URL:http://${COUCHDB_HOSTPORT:localhost:5984}}
    database: patient_files
    admin-user: ${COUCHDB_ADMIN_USER:admin}
    admin-password: ${COUCHDB_ADMIN_PASSWORD:}
    app-user: patientvault_app
    app-password: ${COUCHDB_APP_PASSWORD:}
  validation:
    amka:
      strict-date: false
  bootstrap:
    username: ${APP_BOOTSTRAP_USERNAME:}
    password: ${APP_BOOTSTRAP_PASSWORD:}
  crypto:
    master-keys: ${APP_MASTER_KEYS:}
    active-key-id: ${APP_ACTIVE_KEY_ID:}
    blind-index-key-id: ${APP_BLIND_INDEX_KEY_ID:}
