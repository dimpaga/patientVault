services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-patientvault}
      POSTGRES_USER: ${DB_USER:-patientvault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-patientvault}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-patientvault} -d ${DB_NAME:-patientvault}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible emulator for local development (the real bucket is never used by local/test profiles by default)
  s3:
    image: adobe/s3mock:latest
    user: root   # the named volume is root-owned; development only
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-patientvault-files-local}
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3data
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - s3data:/s3data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  s3data:
